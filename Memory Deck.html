<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7f7f4"><title>Lingua Deck</title><style>
:root{--bg:#f7f7f4;--paper:#fff;--ink:#263329;--muted:#879187;--line:#e8ebe4;--sage:#e8eee6;--green:#304536;--red:#a65e52}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}button,input,textarea{font:inherit}button{cursor:pointer;border:0}.app{max-width:960px;margin:auto;min-height:100vh;padding:24px 22px 40px}.hero{background:var(--sage);border-radius:26px;padding:30px}.eyebrow{font-size:10px;letter-spacing:2px;font-weight:800;color:#748373}.brand{font-size:clamp(32px,6vw,44px);letter-spacing:-2px;font-weight:850;margin:7px 0 4px}.sub{color:#718071;margin:0;font-size:14px}.actions,.row{display:flex;gap:10px;margin-top:24px;flex-wrap:wrap}.btn{padding:12px 17px;border-radius:12px;font-weight:750;font-size:13px;background:var(--green);color:white}.btn.secondary{background:#f8faf7;color:#354737;border:1px solid #d7dfd4}.btn.ghost{background:transparent;color:#667567}.btn.danger{background:#f8eae7;color:#9d554a;border:1px solid #efd7d1}.section{display:flex;justify-content:space-between;align-items:center;margin:27px 2px 13px}.section h2{font-size:17px;margin:0}.count{font-size:12px;color:var(--muted);font-weight:700}.deck-list,.drafts,.card-list{display:grid;gap:10px}.deck{display:flex;align-items:center;gap:14px;text-align:left;background:white;border:1px solid var(--line);border-radius:17px;padding:15px;width:100%;color:inherit}.number{width:42px;height:42px;border-radius:13px;background:#eef2ec;display:grid;place-items:center;color:#667966;font-size:12px;font-weight:800}.deck-info{flex:1;min-width:0}.deck-title{font-size:15px;font-weight:800}.deck-meta{font-size:12px;color:var(--muted);margin-top:4px}.chev{font-size:20px;color:#9aa69a}.empty{text-align:center;padding:60px 20px;color:var(--muted)}.empty h3{color:#3a493c}.empty p{font-size:13px;line-height:1.6;max-width:360px;margin:auto}.footer{text-align:center;color:#a0a89f;font-size:11px;margin:24px 0}.screen-head{display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line);padding:4px 0 17px;margin-bottom:23px}.back{background:none;color:#687969;font-weight:750;padding:8px 4px}.screen-head h2{font-size:16px;margin:0}.panel{background:white;border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:14px}.label{display:block;font-size:10px;letter-spacing:1.5px;color:#819080;font-weight:850;margin:18px 0 8px}.field{width:100%;border:1px solid var(--line);border-radius:12px;padding:13px 14px;background:#fff;color:var(--ink);outline:none}.field:focus{border-color:#91a58f}.field.title{font-size:22px;font-weight:800}.textarea{min-height:90px;resize:vertical}.muted{font-size:12px;color:var(--muted);line-height:1.6}.draft,.card-row{display:flex;gap:12px;align-items:center;background:#f9faf8;border-radius:12px;padding:12px}.draft main,.card-copy{flex:1;min-width:0}.draft strong,.card-copy strong{display:block;font-size:13px}.draft small,.card-copy p{display:block;color:var(--muted);margin:4px 0 0;font-size:12px;overflow-wrap:anywhere}.x{background:none;color:var(--red);font-size:22px}.card-row{background:white;border:1px solid var(--line);cursor:pointer}.card-row.selected{background:#f0f4ee;border-color:#94a68f}.check{width:21px;height:21px;border:1.5px solid #cbd5c8;border-radius:7px;display:grid;place-items:center}.selected .check{background:var(--green);color:white}.play-top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:16px 0}.play-top h1{font-size:25px;margin:5px 0}.instructions{display:flex;justify-content:space-between;gap:14px;margin:10px 0 18px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(175px,1fr));gap:12px}.flip{min-height:190px;position:relative;border-radius:19px;background:#e7ede5;border:1px solid #dce4d9;padding:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#526a54}.flip.open{background:white;color:#2e3e30}.idx{position:absolute;top:13px;left:14px;color:#9baa98;font-size:10px;font-weight:800}.q{font-size:43px}.hint{font-size:9px;letter-spacing:1.3px;font-weight:850;margin-top:10px}.answer{font-size:17px;line-height:1.45;font-weight:750;overflow-wrap:anywhere}.play-bottom{display:flex;justify-content:space-between;gap:10px;margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}@media(max-width:560px){.app{padding:12px 14px 28px}.hero{padding:24px 20px}.actions .btn{flex:1}.play-top,.instructions{align-items:flex-start;flex-direction:column}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.flip{min-height:165px;padding:12px}.panel{padding:16px}}
</style></head><body><main class="app" id="app"></main><script>
const KEY='lingua-deck-v1-web';let decks=JSON.parse(localStorage.getItem(KEY)||'[]'),screen='home',activeId=null,editingId=null,draft=[],selected=new Set(),revealed=new Set(),playCards=[];const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8),save=()=>localStorage.setItem(KEY,JSON.stringify(decks)),active=()=>decks.find(d=>d.id===activeId),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const btn=(s,a,k='')=>`<button class="btn ${k}" data-a="${a}">${s}</button>`,head=t=>`<header class="screen-head"><button class="back" data-a="home">← Back</button><h2>${t}</h2></header>`;
function render(){let el=document.querySelector('#app');if(screen==='home')el.innerHTML=`<section class="hero"><div class="eyebrow">LANGUAGE, IN ACTION</div><div class="brand">Memory Deck</div><div class="actions">${btn('＋ Create','create')}${btn('▶ Play','choose','secondary')}</div></section><div class="section"><h2>Your decks</h2><span class="count">${decks.length} decks</span></div>${decks.length?`<div class="deck-list">${decks.map((d,i)=>`<button class="deck" data-a="open" data-id="${d.id}"><span class="number">${String(i+1).padStart(2,'0')}</span><span class="deck-info"><span class="deck-title">${esc(d.title)}</span><span class="deck-meta">${d.cards.length} cards</span></span><span class="chev">›</span></button>`).join('')}</div>`:`<div class="empty"><div style="font-size:36px">✳</div><h3>Your first deck starts here</h3><p>Create prompts or questions, then use them to spark real conversations.</p></div>`}<div class="footer">Made for classrooms, study groups and curious minds.</div>`;
if(screen==='create')el.innerHTML=`${head(editingId?'Edit deck':'Create a deck')}<section class="panel"><label class="label">DECK NAME</label><input id="title" class="field title" placeholder="e.g. Everyday English" value="${esc(document.querySelector('#title')?.value??(editingId?active()?.title||'':''))}"><div class="section"><h2>Build your cards</h2><span class="count">${draft.length} cards</span></div><p class="muted">Add a word, prompt or question for your memory game.</p><label class="label">CARD CONTENT</label><textarea id="content" class="field textarea" placeholder="e.g. carro · I drive a car."></textarea><div style="margin-top:12px">${btn('＋ Add card','add','secondary')}</div></section><div class="drafts">${draft.map((c,i)=>`<div class="draft"><span class="count">${i+1}</span><main><small>${esc(c.content)}</small></main><button class="x" data-a="remove" data-id="${c.id}">×</button></div>`).join('')}</div><div class="row">${btn(editingId?'Save changes':'Save deck','save')}</div>`;
if(screen==='deck'&&active()){let d=active();el.innerHTML=`${head('Deck details')}<section class="panel"><h1>${esc(d.title)}</h1><p class="muted">${d.cards.length} cards · Tap a row to select it</p><div class="row">${btn('Edit deck','edit','secondary')}${btn('Delete deck','delete-deck','danger')}</div></section><div class="card-list">${d.cards.map(c=>`<div class="card-row ${selected.has(c.id)?'selected':''}" data-a="select" data-id="${c.id}"><span class="check">${selected.has(c.id)?'✓':''}</span><span class="card-copy"><p>${esc(c.content)}</p></span></div>`).join('')}</div>${selected.size?btn(`Delete selected (${selected.size})`,'delete-selected','danger'):''}`}
if(screen==='choose')el.innerHTML=`${head('Choose a deck')}<div class="play-top"><div><div class="eyebrow">READY TO PLAY?</div><h1>Pick your deck</h1><p class="muted">Choose a set of cards to start a speaking activity.</p></div></div>${decks.length?`<div class="deck-list">${decks.map(d=>`<button class="deck" data-a="start" data-id="${d.id}"><span class="deck-info"><span class="deck-title">${esc(d.title)}</span><span class="deck-meta">${d.cards.length} cards</span></span><span class="chev">Start ↗</span></button>`).join('')}</div>`:`<div class="empty"><h3>No decks yet</h3><p>Create your first deck before starting a game.</p>${btn('＋ Create a deck','create')}</div>`}`;
if(screen==='play'&&active()){let d=active();el.innerHTML=`${head('Play mode')}<div class="play-top"><div><div class="eyebrow">NOW PLAYING</div><h1>${esc(d.title)}</h1></div><div style="display:flex;gap:10px">${btn('🔀 Shuffle','shuffle','secondary')}${btn('Main menu','home','secondary')}</div></div><div class="instructions"><span class="muted">Tap a card to reveal it. Use the word to make a sentence, tell a story or start a conversation.</span><span class="count">${revealed.size}/${playCards.length} revealed</span></div><div class="grid">${playCards.map((c,i)=>`<button class="flip ${revealed.has(c.id)?'open':''}" data-a="flip" data-id="${c.id}"><span class="idx">${i+1}</span>${revealed.has(c.id)?`<span class="hint">REVEALED</span><span class="answer">${esc(c.content)}</span><span class="hint">TAP TO HIDE</span>`:`<span class="q">?</span><span class="hint">TAP TO REVEAL</span>`}</button>`).join('')}</div><div class="play-bottom">${btn('Hide all cards','hide','ghost')}${btn('Main menu','home','secondary')}</div>`}}
document.addEventListener('click',e=>{let b=e.target.closest('[data-a]');if(!b)return;let a=b.dataset.a,cid=b.dataset.id;if(a==='home'){screen='home'}else if(a==='create'){editingId=null;draft=[];screen='create'}else if(a==='choose'){screen='choose'}else if(a==='open'){activeId=cid;selected.clear();screen='deck'}else if(a==='start'){activeId=cid;playCards=[...active().cards];revealed.clear();screen='play'}else if(a==='shuffle'){playCards=[...playCards].sort(()=>Math.random()-0.5);revealed.clear()}else if(a==='add'){let v=document.querySelector('#content').value.trim();if(!v){alert('Fill in the card content first.');return}draft.push({id:uid(),content:v})}else if(a==='remove'){draft=draft.filter(c=>c.id!==cid)}else if(a==='save'){let t=document.querySelector('#title').value.trim();if(!t||!draft.length){alert(!t?'Please name your deck.':'Add at least one card.');return}if(editingId)decks=decks.map(d=>d.id===editingId?{...d,title:t,cards:draft}:d);else decks.unshift({id:uid(),title:t,cards:draft});save();screen='home'}else if(a==='edit'){editingId=activeId;draft=active().cards.map(c=>({...c}));screen='create'}else if(a==='delete-deck'){if(confirm('Delete this entire deck and all its cards?')){decks=decks.filter(d=>d.id!==activeId);save();screen='home'}}else if(a==='select'){selected.has(cid)?selected.delete(cid):selected.add(cid)}else if(a==='delete-selected'){if(confirm(`Delete ${selected.size} selected cards?`)){active().cards=active().cards.filter(c=>!selected.has(c.id));selected.clear();save()}}else if(a==='flip'){revealed.has(cid)?revealed.delete(cid):revealed.add(cid)}else if(a==='hide'){revealed.clear()}render()});render();
</script></body></html>
